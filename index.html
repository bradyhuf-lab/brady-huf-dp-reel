<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brady Huf Social Reel</title>
<meta name="description" content="Brady Huf, photographer and director of photography. Social reel, Mitsubishi video spots, and GM Fleet photo and video.">
<meta property="og:type" content="website">
<meta property="og:title" content="Brady Huf Social Reel">
<meta property="og:description" content="Photographer and director of photography. Social reel, Mitsubishi video spots, and GM Fleet photo and video.">
<meta property="og:url" content="https://reel.huf.media/">
<meta property="og:image" content="https://reel.huf.media/og-social.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Brady Huf Social Reel">
<meta name="twitter:image" content="https://reel.huf.media/og-social.jpg">
<meta name="theme-color" content="#0a0a0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=DM+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500&display=swap">
<style>
/* Layout: a wall of vertical clips fills the first screen, giant type sits on the footage,
   work follows in full-width bands, and the page ends on an inverted paper footer. Single dark look by design. */
:root {
  --ink: #0a0a0a;
  --ink-2: #151515;
  --line: rgba(244, 241, 234, .14);
  --fg: #f4f1ea;
  --muted: #8d8a83;
  --paper: #ece8df;
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --mono: "DM Mono", ui-monospace, Menlo, monospace;
  --gutter: clamp(16px, 3vw, 40px);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--ink);
  color: var(--fg);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow-x: clip;
}
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
.wrap {
  padding-left: max(var(--gutter), env(safe-area-inset-left, 0px));
  padding-right: max(var(--gutter), env(safe-area-inset-right, 0px));
}
.label {
  font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--muted); margin: 0;
}

/* Header floats over the footage */
.top {
  position: fixed; top: 0; left: 0; right: 0; z-index: 5;
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding-top: calc(env(safe-area-inset-top, 0px) + 18px); padding-bottom: 18px;
  color: #fff; pointer-events: none;
  background: linear-gradient(to bottom, rgba(10,10,10,.55), rgba(10,10,10,0));
}
.top a, .top span { pointer-events: auto; }
.brand { font-family: var(--display); font-weight: 900; font-size: 1.45rem; letter-spacing: 0.02em; text-transform: uppercase; line-height: 1; }
.top .mail { font-family: var(--mono); font-size: 0.75rem; letter-spacing: 0.08em; text-decoration: none; }
.top .mail:hover { text-decoration: underline; text-underline-offset: 4px; }

/* Hero: wall of vertical loops */
.hero { position: relative; height: 100svh; min-height: 560px; overflow: hidden; background: var(--ink); }
.wall { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 2px; }
.panel { position: relative; overflow: hidden; border: 0; padding: 0; margin: 0; background: var(--ink-2); cursor: pointer; }
.panel video, .panel img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity .4s, transform .8s; }
.panel .tag {
  position: absolute; top: 76px; left: 14px; z-index: 1;
  font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase; color: #fff;
  opacity: 0; transform: translateY(-4px); transition: opacity .3s, transform .3s;
}
@media (hover: hover) {
  .wall:hover .panel video { opacity: .35; }
  .wall .panel:hover video { opacity: 1; transform: scale(1.03); }
  .panel:hover .tag { opacity: 1; transform: none; }
}
@media (max-width: 1100px) { .wall { grid-template-columns: repeat(3, minmax(0, 1fr)); } .panel.edge { display: none; } }
@media (max-width: 700px)  { .wall { grid-template-columns: 1fr; } .panel:not(.center) { display: none; } }

.hero::after {
  content: ""; position: absolute; inset: auto 0 0 0; height: 62%; pointer-events: none;
  background: linear-gradient(to top, rgba(10,10,10,.92) 0%, rgba(10,10,10,.55) 40%, rgba(10,10,10,0) 100%);
}
.hero-text { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; pointer-events: none; padding-bottom: max(20px, env(safe-area-inset-bottom, 0px)); }
.hero-text .row { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; margin-bottom: 6px; }
.hero h1 {
  margin: 0; font-family: var(--display); font-weight: 900; text-transform: uppercase;
  font-size: clamp(5rem, 17.6vw, 21rem); line-height: .78; letter-spacing: -0.01em; color: var(--fg);
  white-space: nowrap;
}
.hero h1 span { display: inline-block; }
@media (max-width: 700px) {
  .hero h1 { font-size: 27vw; white-space: normal; }
  .hero h1 span { display: block; }
}
.play {
  pointer-events: auto; display: inline-flex; align-items: center; gap: 10px;
  background: var(--fg); color: var(--ink); border: 0; cursor: pointer;
  font-family: var(--mono); font-size: 0.75rem; letter-spacing: 0.14em; text-transform: uppercase;
  padding: 12px 16px 11px; transition: background .2s;
}
.play::before { content: ""; width: 0; height: 0; border-left: 8px solid currentColor; border-top: 5px solid transparent; border-bottom: 5px solid transparent; }
.play:hover { background: #fff; }
.hero .who { color: var(--fg); font-family: var(--mono); font-size: 0.75rem; letter-spacing: 0.14em; text-transform: uppercase; }

/* Kind words */
.words { padding-block: clamp(64px, 10vw, 140px); display: grid; gap: 40px; }
.quotes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 40px clamp(32px, 5vw, 80px); }
@media (max-width: 860px) { .quotes { grid-template-columns: 1fr; } }
.quote { margin: 0; display: grid; gap: 20px; align-content: start; padding-top: 20px; border-top: 1px solid var(--line); min-width: 0; }
.quote blockquote { margin: 0; font-size: clamp(1.25rem, 2.1vw, 1.75rem); line-height: 1.3; font-weight: 400; letter-spacing: -0.01em; text-wrap: pretty; max-width: 36ch; }
.quote figcaption { font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.quote figcaption b { color: var(--fg); font-weight: 500; }

/* Section titles: outlined, full width */
.band { padding-bottom: clamp(72px, 10vw, 140px); }
.band-head { display: grid; gap: 4px; margin-bottom: clamp(20px, 3vw, 36px); }
.band-head h2 {
  margin: 0; font-family: var(--display); font-weight: 800; text-transform: uppercase;
  font-size: clamp(4rem, 15vw, 17rem); line-height: .8; letter-spacing: -0.005em;
  color: transparent; -webkit-text-stroke: 1.5px var(--fg);
}
.band-head .meta { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

/* Mitsubishi spots */
.spots { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px; }
@media (max-width: 860px) { .spots { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.spot { margin: 0; min-width: 0; display: grid; gap: 12px; }
.spot button { position: relative; display: block; width: 100%; aspect-ratio: 9 / 16; max-width: 100%; padding: 0; border: 0; background: var(--ink-2); cursor: pointer; overflow: hidden; }
.spot video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .8s; }
.spot button::after {
  content: "Play with sound"; position: absolute; left: 12px; bottom: 12px;
  font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase;
  background: var(--fg); color: var(--ink); padding: 7px 10px 6px; opacity: 0; transition: opacity .25s;
}
@media (hover: hover) { .spot button:hover video { transform: scale(1.04); } .spot button:hover::after { opacity: 1; } }
@media (hover: none) { .spot button::after { content: "▶ Sound"; opacity: 1; } }
.spot figcaption { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding-inline: 2px; flex-wrap: wrap; }
.spot h3 { margin: 0; font-family: var(--display); font-weight: 800; font-size: clamp(1.4rem, 2.4vw, 2rem); text-transform: uppercase; line-height: 1; }

/* GM Fleet stills. Photos are dealt into columns left to right, so list order reads across rows. */
.stills { display: flex; align-items: flex-start; gap: 2px; }
.stills-col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.still { display: block; width: 100%; margin: 0; padding: 0; border: 0; background: var(--ink-2); cursor: zoom-in; overflow: hidden; }
.still img { display: block; width: 100%; height: auto; transition: transform .8s, opacity .3s; }
@media (hover: hover) { .still:hover img { transform: scale(1.03); } }

/* Viewer for photos and videos */
.viewer {
  position: fixed; inset: 0; z-index: 10; display: none;
  align-items: center; justify-content: center;
  background: rgba(6, 6, 6, .97); padding: 64px 16px;
}
.viewer.open { display: flex; }
.viewer img, .viewer video { max-width: 100%; max-height: 100%; object-fit: contain; background: #000; }
.viewer[data-mode="photo"] video, .viewer[data-mode="video"] img,
.viewer[data-mode="video"] .vw-prev, .viewer[data-mode="video"] .vw-next, .viewer[data-mode="video"] .vw-count { display: none; }
.vw-btn {
  position: absolute; background: transparent; border: 0; color: var(--fg); cursor: pointer;
  font-family: var(--mono); font-size: 0.75rem; letter-spacing: 0.14em; text-transform: uppercase; padding: 16px;
}
.vw-btn:hover { text-decoration: underline; text-underline-offset: 4px; }
.vw-close { top: calc(env(safe-area-inset-top, 0px) + 8px); right: max(8px, env(safe-area-inset-right, 0px)); }
.vw-prev { left: max(8px, env(safe-area-inset-left, 0px)); top: 50%; transform: translateY(-50%); }
.vw-next { right: max(8px, env(safe-area-inset-right, 0px)); top: 50%; transform: translateY(-50%); }
.vw-count { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 24px); left: max(24px, env(safe-area-inset-left, 0px)); font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.14em; color: var(--muted); }
@media (max-width: 720px) { .vw-prev, .vw-next { top: auto; bottom: max(8px, env(safe-area-inset-bottom, 0px)); transform: none; } }

/* Footer: inverted paper */
footer { background: var(--paper); color: var(--ink); padding-block: clamp(48px, 7vw, 96px) max(24px, env(safe-area-inset-bottom, 0px)); }
footer .label { color: #6b675f; }
.big-mail {
  display: block; margin: 12px 0 clamp(40px, 6vw, 72px); text-decoration: none;
  font-family: var(--display); font-weight: 900; text-transform: uppercase;
  font-size: clamp(2.6rem, 12.4vw, 15rem); line-height: .82; letter-spacing: -0.01em;
  overflow-wrap: anywhere;
}
.big-mail:hover { color: transparent; -webkit-text-stroke: 1.5px var(--ink); }
.foot { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-top: 1px solid rgba(10,10,10,.2); padding-top: 18px; }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .panel video, .spot video, .still img { transition: none; }
}
</style>
</head>
<body>

<header class="top wrap">
  <span class="brand">Brady Huf</span>
  <a class="mail" href="mailto:brady@huf.media">brady@huf.media</a>
</header>

<main>
  <section class="hero" aria-label="Social reel">
    <div class="wall" id="wall">
      <button class="panel edge" data-clip="farmers"><span class="tag">Farmers Market</span></button>
      <button class="panel" data-clip="fishing"><span class="tag">Fishing</span></button>
      <button class="panel center" data-clip="reel"><span class="tag">Social Reel</span></button>
      <button class="panel" data-clip="picnic"><span class="tag">Picnic</span></button>
      <button class="panel edge" data-clip="prom"><span class="tag">Prom</span></button>
    </div>
    <div class="hero-text wrap">
      <div class="row">
        <span class="who">Photo + Video · Director of Photography</span>
        <button class="play" data-clip="reel">Play reel with sound</button>
      </div>
      <h1><span>Social</span> <span>Reel</span></h1>
    </div>
  </section>

  <section class="words wrap" aria-label="Testimonials">
    <p class="label">Kind words</p>
    <div class="quotes">
      <figure class="quote">
        <blockquote>Brady was fantastic to work with! Highly self-sufficient and captured far more photo and video content than we planned for which we will be utilizing.</blockquote>
        <figcaption><b>Erik Zaar</b> · Digitas</figcaption>
      </figure>
      <figure class="quote">
        <blockquote>Working with Brady on set is a breeze. He anticipates what the motion team is moving to next and stays aware of the full project schedule. He moves quickly while keeping the energy positive, which makes the AD process so much smoother for me.</blockquote>
        <figcaption><b>Autumn Spadaro</b> · Assistant Director</figcaption>
      </figure>
    </div>
  </section>

  <section class="band" aria-labelledby="mitsu">
    <div class="band-head wrap">
      <h2 id="mitsu">Mitsubishi</h2>
      <div class="meta"><span class="label">Video · 4 spots</span><span class="label">9:16</span></div>
    </div>
    <div class="spots wrap">
      <figure class="spot">
        <button data-clip="farmers" aria-label="Play Farmers Market with sound"></button>
        <figcaption><h3>Farmers Market</h3><span class="label">0:14</span></figcaption>
      </figure>
      <figure class="spot">
        <button data-clip="fishing" aria-label="Play Fishing with sound"></button>
        <figcaption><h3>Fishing</h3><span class="label">0:15</span></figcaption>
      </figure>
      <figure class="spot">
        <button data-clip="picnic" aria-label="Play Picnic with sound"></button>
        <figcaption><h3>Picnic</h3><span class="label">0:17</span></figcaption>
      </figure>
      <figure class="spot">
        <button data-clip="prom" aria-label="Play Prom with sound"></button>
        <figcaption><h3>Prom</h3><span class="label">0:17</span></figcaption>
      </figure>
    </div>
  </section>

  <section class="band" aria-labelledby="gm">
    <div class="band-head wrap">
      <h2 id="gm">GM Fleet</h2>
      <div class="meta"><span class="label">Photo + Video</span><span class="label">Stills</span></div>
    </div>
    <div class="stills wrap" id="stills"></div>
  </section>
</main>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Viewer" data-mode="photo">
  <span class="vw-count" id="vw-count"></span>
  <button class="vw-btn vw-close" id="vw-close" aria-label="Close">Close ✕</button>
  <button class="vw-btn vw-prev" id="vw-prev" aria-label="Previous photo">← Prev</button>
  <img id="vw-img" alt="">
  <video id="vw-video" controls playsinline></video>
  <button class="vw-btn vw-next" id="vw-next" aria-label="Next photo">Next →</button>
</div>

<footer class="wrap">
  <p class="label">Booking + inquiries</p>
  <a class="big-mail" href="mailto:brady@huf.media">brady@huf.media</a>
  <div class="foot">
    <span class="label">© 2026 Brady Huf</span>
    <span class="label">Photo + Video · Director of Photography</span>
  </div>
</footer>

<script>
  // Each clip has a short muted loop for autoplay and the full export for playback with sound.
  const CLIPS = {
    reel:    { loop: "media/loop-reel.mp4",           full: "media/reel.mp4",           poster: "media/reel.jpg" },
    farmers: { loop: "media/loop-farmers-market.mp4", full: "media/farmers-market.mp4", poster: "media/farmers-market.jpg" },
    fishing: { loop: "media/loop-fishing.mp4",        full: "media/fishing.mp4",        poster: "media/fishing.jpg" },
    picnic:  { loop: "media/loop-picnic.mp4",         full: "media/picnic.mp4",         poster: "media/picnic.jpg" },
    prom:    { loop: "media/loop-prom.mp4",           full: "media/prom.mp4",           poster: "media/prom.jpg" },
  };
  const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;

  function loopVideo(clip) {
    const v = document.createElement("video");
    v.muted = true; v.loop = true; v.playsInline = true; v.autoplay = !calm;
    v.setAttribute("muted", ""); v.setAttribute("playsinline", "");
    v.preload = "metadata";
    v.poster = clip.poster;
    v.src = clip.loop;
    v.setAttribute("aria-hidden", "true");
    return v;
  }

  // Fill the hero panels and the spot cards with loops.
  document.querySelectorAll(".panel[data-clip], .spot button[data-clip]").forEach((el) => {
    el.prepend(loopVideo(CLIPS[el.dataset.clip]));
  });

  // Play loops only while they're on screen and their panel is showing.
  const loops = document.querySelectorAll(".panel video, .spot video");
  if (!calm && "IntersectionObserver" in window) {
    const io = new IntersectionObserver((entries) => {
      entries.forEach(({ target, isIntersecting }) => {
        if (isIntersecting && target.offsetParent !== null) target.play().catch(() => {});
        else target.pause();
      });
    }, { threshold: 0.15 });
    loops.forEach((v) => io.observe(v));
  }

  // Stills. Thumbnails in media/photos/thumb, full size in media/photos.
  const PHOTOS = [
    { file: "fleet-05.jpg", alt: "White Silverado parked below quarry walls" },
    { file: "fleet-09.jpg", alt: "Builder checking a phone at a sawhorse table, Silverado behind" },
    { file: "fleet-11.jpg", alt: "Close-up of a Silverado grille and headlight" },
    { file: "fleet-03.jpg", alt: "White Silverado with headlights on at dusk on a cleared lot" },
    { file: "fleet-welder.jpg", alt: "Welder at night surrounded by sparks and smoke" },
    { file: "fleet-04.jpg", alt: "Worker in a hard hat on a phone call, leaning on a truck bed" },
    { file: "fleet-06.jpg", alt: "Woman working on a laptop on a tailgate beside a telehandler" },
    { file: "fleet-07.jpg", alt: "Man stepping out of a white pickup on a gravel job site" },
    { file: "fleet-08.jpg", alt: "Blue Silverado HD and white Silverado in a quarry" },
    { file: "fleet-12.jpg", alt: "Woman on a laptop on a tailgate next to lumber stacks and framing" },
    { file: "fleet-14.jpg", alt: "Builder reviewing plans at a plywood table, Silverado behind" },
    { file: "fleet-16.jpg", alt: "White Silverado parked at a new home construction site" },
    { file: "fleet-17.jpg", alt: "Rear of a Silverado with a toolbox, beside a stack of sheathing" },
  ];

  const stills = document.getElementById("stills");
  const tiles = PHOTOS.map((p, i) => {
    const btn = document.createElement("button");
    btn.className = "still";
    btn.setAttribute("aria-label", `View photo ${i + 1}: ${p.alt}`);
    btn.innerHTML = `<img src="media/photos/thumb/${p.file}" alt="${p.alt}" loading="lazy">`;
    btn.addEventListener("click", () => openPhoto(i));
    return btn;
  });

  // Deal tiles across columns so the first photos in the list fill the top row.
  const narrow = matchMedia("(max-width: 860px)");
  function layoutStills() {
    const count = narrow.matches ? 2 : 3;
    const cols = Array.from({ length: count }, () => {
      const col = document.createElement("div");
      col.className = "stills-col";
      return col;
    });
    tiles.forEach((tile, i) => cols[i % count].appendChild(tile));
    stills.replaceChildren(...cols);
  }
  layoutStills();
  narrow.addEventListener("change", layoutStills);

  // Viewer: photos with prev/next, or one video with sound.
  const viewer = document.getElementById("viewer");
  const vwImg = document.getElementById("vw-img");
  const vwVideo = document.getElementById("vw-video");
  const vwCount = document.getElementById("vw-count");
  let current = 0;
  let opener = null;

  function open(mode) {
    opener = document.activeElement;
    viewer.dataset.mode = mode;
    viewer.classList.add("open");
    document.body.style.overflow = "hidden";
    loops.forEach((v) => v.pause());
    document.getElementById("vw-close").focus();
  }
  function showPhoto(i) {
    current = (i + PHOTOS.length) % PHOTOS.length;
    vwImg.src = `media/photos/${PHOTOS[current].file}`;
    vwImg.alt = PHOTOS[current].alt;
    vwCount.textContent = `${String(current + 1).padStart(2, "0")} / ${PHOTOS.length}`;
  }
  function openPhoto(i) { showPhoto(i); open("photo"); }
  function openClip(key) {
    const clip = CLIPS[key];
    vwVideo.poster = clip.poster;
    vwVideo.src = clip.full;
    open("video");
    vwVideo.play().catch(() => {});
  }
  function close() {
    viewer.classList.remove("open");
    vwVideo.pause();
    vwVideo.removeAttribute("src");
    vwVideo.load();
    document.body.style.overflow = "";
    if (!calm) loops.forEach((v) => { if (v.offsetParent !== null) v.play().catch(() => {}); });
    if (opener) opener.focus();
  }

  document.querySelectorAll("[data-clip]").forEach((el) => {
    el.addEventListener("click", () => openClip(el.dataset.clip));
  });
  document.getElementById("vw-close").addEventListener("click", close);
  document.getElementById("vw-prev").addEventListener("click", () => showPhoto(current - 1));
  document.getElementById("vw-next").addEventListener("click", () => showPhoto(current + 1));
  viewer.addEventListener("click", (e) => { if (e.target === viewer) close(); });
  document.addEventListener("keydown", (e) => {
    if (!viewer.classList.contains("open")) return;
    if (e.key === "Escape") close();
    if (viewer.dataset.mode !== "photo") return;
    if (e.key === "ArrowLeft") showPhoto(current - 1);
    if (e.key === "ArrowRight") showPhoto(current + 1);
  });
</script>
</body>
</html>
