<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brady Huf Social Reel</title>
<meta name="description" content="Brady Huf, photographer and director of photography. Social reel, Mitsubishi video spots, and GM Fleet photo and video.">
<meta property="og:type" content="website">
<meta property="og:title" content="Brady Huf Social Reel">
<meta property="og:description" content="Photographer and director of photography. Social reel, Mitsubishi video spots, and GM Fleet photo and video.">
<meta property="og:url" content="https://reel.huf.media/">
<meta property="og:image" content="https://reel.huf.media/og-social.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Brady Huf Social Reel">
<meta name="twitter:image" content="https://reel.huf.media/og-social.jpg">
<meta name="theme-color" content="#0d0e0f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: screening room. Main reel full width, four vertical Mitsubishi spots in a row, email at top and bottom. Single dark look by design. */
:root {
  --bg: #0d0e0f;
  --surface: #16181a;
  --line: #2a2d30;
  --fg: #ece9e3;
  --muted: #8b8f93;
  --accent: #d9b26a;        /* tungsten 3200K */
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --body: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
.wrap {
  max-width: 1240px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
a { color: inherit; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

/* Header */
header { border-bottom: 1px solid var(--line); }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px 16px; padding-block: 18px; flex-wrap: wrap; }
.name {
  font-family: var(--display);
  font-stretch: 125%;
  font-weight: 800;
  font-size: 1.05rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.name span { color: var(--muted); font-weight: 400; font-stretch: 100%; letter-spacing: 0.08em; margin-left: 10px; font-size: 0.78rem; }
.email {
  font-family: var(--mono); font-size: 0.8rem; letter-spacing: 0.06em;
  text-decoration: none; color: var(--fg);
  border-bottom: 1px solid var(--line); padding-bottom: 2px; transition: border-color .2s;
}
.email:hover { border-color: var(--accent); }

/* Frames */
.frame { position: relative; max-width: 100%; background: var(--surface); overflow: hidden; }
.frame.wide { aspect-ratio: 16 / 9; }
.frame.tall { aspect-ratio: 9 / 16; }
.frame video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
.ph {
  position: absolute; inset: 0;
  background:
    linear-gradient(var(--line), var(--line)) center / 1px 22px no-repeat,
    linear-gradient(var(--line), var(--line)) center / 22px 1px no-repeat,
    radial-gradient(ellipse at center, #1c1f22 0%, var(--surface) 70%);
}
.ph::before {
  content: ""; position: absolute; left: 6%; right: 6%; top: 50%;
  aspect-ratio: 2.39 / 1; transform: translateY(-50%);
  border: 1px dashed #3a3e42;
}
.ph-label {
  position: absolute; left: 0; right: 0; bottom: 0;
  display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding: 12px 14px;
  font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
}
.ph-label b { color: var(--accent); font-weight: 500; }
.corner { position: absolute; width: 18px; height: 18px; border-color: var(--muted); border-style: solid; opacity: .6; }
.corner.tl { top: 12px; left: 12px; border-width: 1px 0 0 1px; }
.corner.tr { top: 12px; right: 12px; border-width: 1px 1px 0 0; }
.corner.bl { bottom: 40px; left: 12px; border-width: 0 0 1px 1px; }
.corner.br { bottom: 40px; right: 12px; border-width: 0 1px 1px 0; }
.rec {
  position: absolute; top: 14px; left: 40px;
  font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.1em; color: var(--muted);
  display: flex; align-items: center; gap: 8px;
}
.rec::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #b8433a; }

/* Main reel */
.hero { padding-block: 48px 72px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 400px); align-items: end; gap: 32px; }
.hero .frame { width: 100%; }
@media (max-width: 720px) { .hero { grid-template-columns: 1fr; gap: 24px; } .hero .frame { max-width: 420px; } }
.hero h1 {
  font-family: var(--display);
  font-stretch: 62%;
  font-weight: 700;
  font-size: clamp(3rem, 11vw, 8.5rem);
  line-height: 0.88;
  letter-spacing: -0.01em;
  text-transform: uppercase;
  margin: 0;
  text-wrap: balance;
}
.hero h1 em { font-style: normal; color: var(--accent); }
.tag { font-family: var(--mono); font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 0; }

/* Mitsubishi spots */
.head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; border-top: 1px solid var(--line); padding-block: 20px 28px; flex-wrap: wrap; }
.head h2 {
  margin: 0; font-family: var(--display); font-stretch: 125%; font-weight: 700;
  font-size: 0.95rem; letter-spacing: 0.1em; text-transform: uppercase;
}
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; padding-bottom: 88px; }
@media (max-width: 860px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 14px; } }
.spot { display: grid; gap: 12px; min-width: 0; margin: 0; }
.spot figcaption { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.spot h3 { margin: 0; font-size: 1.05rem; font-weight: 600; }
.spot .client { font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }

/* Stills */
/* Photos are dealt into columns left to right, so list order reads across rows. */
.stills { display: flex; align-items: flex-start; gap: 20px; padding-bottom: 88px; }
.stills-col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 20px; }
@media (max-width: 860px) { .stills, .stills-col { gap: 14px; } }
.still {
  display: block; width: 100%; margin: 0; padding: 0; border: 0;
  background: var(--surface); cursor: zoom-in;
}
.still img { display: block; width: 100%; height: auto; transition: opacity .25s; }
.still:hover img { opacity: .85; }

.lightbox {
  position: fixed; inset: 0; z-index: 10; display: none;
  align-items: center; justify-content: center;
  background: rgba(8, 9, 10, .96); padding: 56px 16px;
}
.lightbox.open { display: flex; }
.lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; }
.lb-btn {
  position: absolute; background: rgba(8, 9, 10, .7); border: 0; color: var(--fg); cursor: pointer;
  font-family: var(--mono); font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; padding: 14px;
}
.lb-btn:hover { color: var(--accent); }
.lb-close { top: 6px; right: 6px; }
.lb-prev { left: 6px; top: 50%; transform: translateY(-50%); }
.lb-next { right: 6px; top: 50%; transform: translateY(-50%); }
.lb-count { position: absolute; top: 20px; left: 20px; font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.1em; color: var(--muted); }
@media (max-width: 720px) { .lb-prev, .lb-next { top: auto; bottom: 6px; transform: none; } }

/* Testimonial */
.quote { border-top: 1px solid var(--line); padding-block: 56px 72px; margin: 0; }
.quote blockquote {
  margin: 0; max-width: 30ch;
  font-family: var(--display); font-stretch: 75%; font-weight: 600;
  font-size: clamp(1.6rem, 4.2vw, 2.9rem); line-height: 1.12; text-wrap: balance;
}
.quote blockquote::before { content: "\201C"; color: var(--accent); }
.quote blockquote::after { content: "\201D"; color: var(--accent); }
.quote figcaption { margin-top: 24px; font-family: var(--mono); font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.quote figcaption b { color: var(--fg); font-weight: 500; }

footer { border-top: 1px solid var(--line); }
footer .wrap { display: flex; justify-content: space-between; align-items: center; gap: 12px 16px; flex-wrap: wrap; padding-block: 24px; }
footer small { font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <div class="name">Brady Huf<span>Photo + Video</span></div>
    <a class="email" href="mailto:brady@huf.media">brady@huf.media</a>
  </div>
</header>

<main>
  <section class="wrap hero">
    <h1>Brady Huf<br><em>Social Reel</em></h1>
    <div class="frame tall" data-slot="reel" data-label="Main Reel"></div>
  </section>

  <section class="wrap">
    <figure class="quote">
      <blockquote>Brady was fantastic to work with! Highly self-sufficient and captured far more photo and video content than we planned for which we will be utilizing.</blockquote>
      <figcaption><b>Erik Zaar</b> · Digitas</figcaption>
    </figure>
  </section>

  <section class="wrap">
    <div class="head">
      <h2>Mitsubishi</h2>
      <p class="tag">Video · 4 spots · 9:16</p>
    </div>
    <div class="grid">
      <figure class="spot">
        <div class="frame tall" data-slot="farmers"></div>
        <figcaption><h3>Farmers Market</h3><span class="client">Mitsubishi</span></figcaption>
      </figure>
      <figure class="spot">
        <div class="frame tall" data-slot="fishing"></div>
        <figcaption><h3>Fishing</h3><span class="client">Mitsubishi</span></figcaption>
      </figure>
      <figure class="spot">
        <div class="frame tall" data-slot="picnic"></div>
        <figcaption><h3>Picnic</h3><span class="client">Mitsubishi</span></figcaption>
      </figure>
      <figure class="spot">
        <div class="frame tall" data-slot="prom"></div>
        <figcaption><h3>Prom</h3><span class="client">Mitsubishi</span></figcaption>
      </figure>
    </div>
  </section>

  <section class="wrap">
    <div class="head">
      <h2>GM Fleet</h2>
      <p class="tag">Photo + Video</p>
    </div>
    <div class="stills" id="stills"></div>
  </section>
</main>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <span class="lb-count" id="lb-count"></span>
  <button class="lb-btn lb-close" id="lb-close" aria-label="Close">Close ✕</button>
  <button class="lb-btn lb-prev" id="lb-prev" aria-label="Previous photo">← Prev</button>
  <img id="lb-img" alt="">
  <button class="lb-btn lb-next" id="lb-next" aria-label="Next photo">Next →</button>
</div>

<footer>
  <div class="wrap">
    <a class="email" href="mailto:brady@huf.media">brady@huf.media</a>
    <small>© 2026 Brady Huf</small>
  </div>
</footer>

<script>
  // Video file for each slot. Leave src empty to show the placeholder.
  const VIDEOS = {
    reel:    { src: "media/reel.mp4",           poster: "media/reel.jpg" },
    farmers: { src: "media/farmers-market.mp4", poster: "media/farmers-market.jpg" },
    fishing: { src: "media/fishing.mp4",        poster: "media/fishing.jpg" },
    picnic:  { src: "media/picnic.mp4",         poster: "media/picnic.jpg" },
    prom:    { src: "media/prom.mp4",           poster: "media/prom.jpg" },
  };

  document.querySelectorAll(".frame[data-slot]").forEach((el) => {
    const v = VIDEOS[el.dataset.slot] || {};
    if (v.src) {
      const video = document.createElement("video");
      video.src = v.src;
      if (v.poster) video.poster = v.poster;
      video.controls = true;
      video.playsInline = true;
      video.preload = "none";
      el.appendChild(video);
      return;
    }
    el.innerHTML = `
      <div class="ph" role="img" aria-label="${el.dataset.label} video placeholder">
        <span class="corner tl"></span><span class="corner tr"></span>
        <span class="corner bl"></span><span class="corner br"></span>
        <span class="rec">STBY</span>
        <div class="ph-label"><span><b>${el.dataset.label}</b> · Video coming soon</span><span>TC 00:00:00:00</span></div>
      </div>`;
  });

  // Stills. Thumbnails in media/photos/thumb, full size in media/photos.
  const PHOTOS = [
    { file: "fleet-05.jpg", alt: "White Silverado parked below quarry walls" },
    { file: "fleet-09.jpg", alt: "Builder checking a phone at a sawhorse table, Silverado behind" },
    { file: "fleet-11.jpg", alt: "Close-up of a Silverado grille and headlight" },
    { file: "fleet-03.jpg", alt: "White Silverado with headlights on at dusk on a cleared lot" },
    { file: "fleet-welder.jpg", alt: "Welder at night surrounded by sparks and smoke" },
    { file: "fleet-04.jpg", alt: "Worker in a hard hat on a phone call, leaning on a truck bed" },
    { file: "fleet-06.jpg", alt: "Woman working on a laptop on a tailgate beside a telehandler" },
    { file: "fleet-07.jpg", alt: "Man stepping out of a white pickup on a gravel job site" },
    { file: "fleet-08.jpg", alt: "Blue Silverado HD and white Silverado in a quarry" },
    { file: "fleet-12.jpg", alt: "Woman on a laptop on a tailgate next to lumber stacks and framing" },
    { file: "fleet-14.jpg", alt: "Builder reviewing plans at a plywood table, Silverado behind" },
    { file: "fleet-16.jpg", alt: "White Silverado parked at a new home construction site" },
    { file: "fleet-17.jpg", alt: "Rear of a Silverado with a toolbox, beside a stack of sheathing" },
  ];

  const stills = document.getElementById("stills");
  const tiles = PHOTOS.map((p, i) => {
    const btn = document.createElement("button");
    btn.className = "still";
    btn.setAttribute("aria-label", `View photo ${i + 1}: ${p.alt}`);
    btn.innerHTML = `<img src="media/photos/thumb/${p.file}" alt="${p.alt}" loading="lazy">`;
    btn.addEventListener("click", () => openPhoto(i));
    return btn;
  });

  // Deal tiles across columns so the first photos in the list fill the top row.
  const narrow = matchMedia("(max-width: 860px)");
  function layoutStills() {
    const count = narrow.matches ? 2 : 3;
    const cols = Array.from({ length: count }, () => {
      const col = document.createElement("div");
      col.className = "stills-col";
      return col;
    });
    tiles.forEach((tile, i) => cols[i % count].appendChild(tile));
    stills.replaceChildren(...cols);
  }
  layoutStills();
  narrow.addEventListener("change", layoutStills);

  const lb = document.getElementById("lightbox");
  const lbImg = document.getElementById("lb-img");
  const lbCount = document.getElementById("lb-count");
  let current = 0;
  let opener = null;

  function showPhoto(i) {
    current = (i + PHOTOS.length) % PHOTOS.length;
    lbImg.src = `media/photos/${PHOTOS[current].file}`;
    lbImg.alt = PHOTOS[current].alt;
    lbCount.textContent = `${String(current + 1).padStart(2, "0")} / ${PHOTOS.length}`;
  }
  function openPhoto(i) {
    opener = document.activeElement;
    showPhoto(i);
    lb.classList.add("open");
    document.body.style.overflow = "hidden";
    document.getElementById("lb-close").focus();
  }
  function closePhoto() {
    lb.classList.remove("open");
    document.body.style.overflow = "";
    if (opener) opener.focus();
  }
  document.getElementById("lb-close").addEventListener("click", closePhoto);
  document.getElementById("lb-prev").addEventListener("click", () => showPhoto(current - 1));
  document.getElementById("lb-next").addEventListener("click", () => showPhoto(current + 1));
  lb.addEventListener("click", (e) => { if (e.target === lb) closePhoto(); });
  document.addEventListener("keydown", (e) => {
    if (!lb.classList.contains("open")) return;
    if (e.key === "Escape") closePhoto();
    if (e.key === "ArrowLeft") showPhoto(current - 1);
    if (e.key === "ArrowRight") showPhoto(current + 1);
  });

  // Only one video plays at a time.
  document.addEventListener("play", (e) => {
    document.querySelectorAll("video").forEach((v) => { if (v !== e.target) v.pause(); });
  }, true);
</script>
</body>
</html>
