<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brady Huf Social Reel</title>
<meta name="description" content="Brady Huf, Director of Photography. Main reel and Mitsubishi spots.">
<meta property="og:type" content="website">
<meta property="og:title" content="Brady Huf Social Reel">
<meta property="og:description" content="Director of Photography. Main reel and Mitsubishi spots.">
<meta property="og:url" content="https://reel.huf.media/">
<meta property="og:image" content="https://reel.huf.media/og-social.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Brady Huf Social Reel">
<meta name="twitter:image" content="https://reel.huf.media/og-social.jpg">
<meta name="theme-color" content="#0d0e0f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: screening room. Main reel full width, four vertical Mitsubishi spots in a row, email at top and bottom. Single dark look by design. */
:root {
  --bg: #0d0e0f;
  --surface: #16181a;
  --line: #2a2d30;
  --fg: #ece9e3;
  --muted: #8b8f93;
  --accent: #d9b26a;        /* tungsten 3200K */
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --body: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
.wrap {
  max-width: 1240px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
a { color: inherit; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

/* Header */
header { border-bottom: 1px solid var(--line); }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px 16px; padding-block: 18px; flex-wrap: wrap; }
.name {
  font-family: var(--display);
  font-stretch: 125%;
  font-weight: 800;
  font-size: 1.05rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.name span { color: var(--muted); font-weight: 400; font-stretch: 100%; letter-spacing: 0.08em; margin-left: 10px; font-size: 0.78rem; }
.email {
  font-family: var(--mono); font-size: 0.8rem; letter-spacing: 0.06em;
  text-decoration: none; color: var(--fg);
  border-bottom: 1px solid var(--line); padding-bottom: 2px; transition: border-color .2s;
}
.email:hover { border-color: var(--accent); }

/* Frames */
.frame { position: relative; max-width: 100%; background: var(--surface); overflow: hidden; }
.frame.wide { aspect-ratio: 16 / 9; }
.frame.tall { aspect-ratio: 9 / 16; }
.frame video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
.ph {
  position: absolute; inset: 0;
  background:
    linear-gradient(var(--line), var(--line)) center / 1px 22px no-repeat,
    linear-gradient(var(--line), var(--line)) center / 22px 1px no-repeat,
    radial-gradient(ellipse at center, #1c1f22 0%, var(--surface) 70%);
}
.ph::before {
  content: ""; position: absolute; left: 6%; right: 6%; top: 50%;
  aspect-ratio: 2.39 / 1; transform: translateY(-50%);
  border: 1px dashed #3a3e42;
}
.ph-label {
  position: absolute; left: 0; right: 0; bottom: 0;
  display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding: 12px 14px;
  font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
}
.ph-label b { color: var(--accent); font-weight: 500; }
.corner { position: absolute; width: 18px; height: 18px; border-color: var(--muted); border-style: solid; opacity: .6; }
.corner.tl { top: 12px; left: 12px; border-width: 1px 0 0 1px; }
.corner.tr { top: 12px; right: 12px; border-width: 1px 1px 0 0; }
.corner.bl { bottom: 40px; left: 12px; border-width: 0 0 1px 1px; }
.corner.br { bottom: 40px; right: 12px; border-width: 0 1px 1px 0; }
.rec {
  position: absolute; top: 14px; left: 40px;
  font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.1em; color: var(--muted);
  display: flex; align-items: center; gap: 8px;
}
.rec::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #b8433a; }

/* Main reel */
.hero { padding-block: 48px 72px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 400px); align-items: end; gap: 32px; }
.hero .frame { width: 100%; }
@media (max-width: 720px) { .hero { grid-template-columns: 1fr; gap: 24px; } .hero .frame { max-width: 420px; } }
.hero h1 {
  font-family: var(--display);
  font-stretch: 62%;
  font-weight: 700;
  font-size: clamp(3rem, 11vw, 8.5rem);
  line-height: 0.88;
  letter-spacing: -0.01em;
  text-transform: uppercase;
  margin: 0;
  text-wrap: balance;
}
.hero h1 em { font-style: normal; color: var(--accent); }
.tag { font-family: var(--mono); font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 0; }

/* Mitsubishi spots */
.head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; border-top: 1px solid var(--line); padding-block: 20px 28px; flex-wrap: wrap; }
.head h2 {
  margin: 0; font-family: var(--display); font-stretch: 125%; font-weight: 700;
  font-size: 0.95rem; letter-spacing: 0.1em; text-transform: uppercase;
}
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; padding-bottom: 88px; }
@media (max-width: 860px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 14px; } }
.spot { display: grid; gap: 12px; min-width: 0; margin: 0; }
.spot figcaption { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.spot h3 { margin: 0; font-size: 1.05rem; font-weight: 600; }
.spot .client { font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }

footer { border-top: 1px solid var(--line); }
footer .wrap { display: flex; justify-content: space-between; align-items: center; gap: 12px 16px; flex-wrap: wrap; padding-block: 24px; }
footer small { font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <div class="name">Brady Huf<span>Director of Photography</span></div>
    <a class="email" href="mailto:brady@huf.media">brady@huf.media</a>
  </div>
</header>

<main>
  <section class="wrap hero">
    <h1>Brady Huf<br><em>Social Reel</em></h1>
    <div class="frame tall" data-slot="reel" data-label="Main Reel"></div>
  </section>

  <section class="wrap">
    <div class="head">
      <h2>Mitsubishi</h2>
      <p class="tag">4 spots · 9:16</p>
    </div>
    <div class="grid">
      <figure class="spot">
        <div class="frame tall" data-slot="farmers"></div>
        <figcaption><h3>Farmers Market</h3><span class="client">Mitsubishi</span></figcaption>
      </figure>
      <figure class="spot">
        <div class="frame tall" data-slot="fishing"></div>
        <figcaption><h3>Fishing</h3><span class="client">Mitsubishi</span></figcaption>
      </figure>
      <figure class="spot">
        <div class="frame tall" data-slot="picnic"></div>
        <figcaption><h3>Picnic</h3><span class="client">Mitsubishi</span></figcaption>
      </figure>
      <figure class="spot">
        <div class="frame tall" data-slot="prom"></div>
        <figcaption><h3>Prom</h3><span class="client">Mitsubishi</span></figcaption>
      </figure>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <a class="email" href="mailto:brady@huf.media">brady@huf.media</a>
    <small>© 2026 Brady Huf</small>
  </div>
</footer>

<script>
  // Video file for each slot. Leave src empty to show the placeholder.
  const VIDEOS = {
    reel:    { src: "media/reel.mp4",           poster: "media/reel.jpg" },
    farmers: { src: "media/farmers-market.mp4", poster: "media/farmers-market.jpg" },
    fishing: { src: "media/fishing.mp4",        poster: "media/fishing.jpg" },
    picnic:  { src: "media/picnic.mp4",         poster: "media/picnic.jpg" },
    prom:    { src: "media/prom.mp4",           poster: "media/prom.jpg" },
  };

  document.querySelectorAll(".frame[data-slot]").forEach((el) => {
    const v = VIDEOS[el.dataset.slot] || {};
    if (v.src) {
      const video = document.createElement("video");
      video.src = v.src;
      if (v.poster) video.poster = v.poster;
      video.controls = true;
      video.playsInline = true;
      video.preload = "none";
      el.appendChild(video);
      return;
    }
    el.innerHTML = `
      <div class="ph" role="img" aria-label="${el.dataset.label} video placeholder">
        <span class="corner tl"></span><span class="corner tr"></span>
        <span class="corner bl"></span><span class="corner br"></span>
        <span class="rec">STBY</span>
        <div class="ph-label"><span><b>${el.dataset.label}</b> · Video coming soon</span><span>TC 00:00:00:00</span></div>
      </div>`;
  });

  // Only one video plays at a time.
  document.addEventListener("play", (e) => {
    document.querySelectorAll("video").forEach((v) => { if (v !== e.target) v.pause(); });
  }, true);
</script>
</body>
</html>
